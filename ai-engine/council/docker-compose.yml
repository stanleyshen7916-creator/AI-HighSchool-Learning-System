# 教材上傳引擎 Runtime（2026-09-29 由 AI-Study-Council 併入學習平台）。
# 啟動：雙擊同目錄的「啟動教材上傳引擎.bat」，或
#   docker compose -f ai-engine/council/docker-compose.yml up -d --build
#
# COUNCIL_DATA_DIR：執行期資料（Final.md、上傳原始檔、MinerU 佇列、Ollama 模型、MinerU
# 模型快取）。未設定時為 ai-engine/council/data（已列入 .gitignore）。把它指向舊的
# AI-Study-Council 資料夾即可沿用既有的模型與 Final.md，不必搬移或重新下載。
name: ahs-council

services:
  council-engine:
    restart: unless-stopped   # 2026-10-06：Docker 啟動時自動啟動（手動 stop 的不會自動起來）
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /platform/ai-engine/council
    volumes:
      - ../..:/platform
      # 以映像內（Linux）的 node_modules 為準，不使用主機上的 node_modules
      - /platform/ai-engine/council/node_modules
      - ${COUNCIL_DATA_DIR:-./data}:/data
    environment:
      - PORT=3000
      - COUNCIL_DATA_DIR=/data
      - PLATFORM_ROOT=/platform
      - OLLAMA_URL=http://ollama:11434
      - MINERU_QUEUE_INPUTS_DIR=/data/mineru_inputs
      - MINERU_QUEUE_OUTPUTS_DIR=/data/mineru_outputs
    # 只綁本機：引擎沒有登入機制，不能開放給區網其他裝置
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  ollama:
    restart: unless-stopped   # 2026-10-06：Docker 啟動時自動啟動（手動 stop 的不會自動起來）
    # 2026-10-04：固定 0.9.6。latest（0.33）的 CUDA 函式庫在這台電腦的 NVIDIA 驅動
    # （536.67 / CUDA 12.2）上偵測不到 GPU，會整個退回 CPU（實測一次長 prompt 裁決超過
    # 10 分鐘仍未完成）；0.9.6 可正確使用 GTX 1660 Ti。更新顯卡驅動後才可改回 latest。
    image: ollama/ollama:0.9.6
    volumes:
      - ${COUNCIL_DATA_DIR:-./data}/ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      # 整本教材的 SOURCE 需要較大的 context（引擎依 prompt 長度自動設定 num_ctx，最大
      # 32768）。Flash attention＋8-bit KV cache 讓長 context 佔用的顯示記憶體減半。
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    # 2026-11-03：NVIDIA GPU 改由 docker-compose.nvidia.yml 加上（啟動器偵測到 nvidia-smi
    # 才套用）。新筆電是 Intel Arc，沒有 NVIDIA，保留 GPU 時容器根本起不來；那台改用
    # docker-compose.host-ollama.yml 連主機 Ollama（內建顯示卡）。兩個都不套用時走 CPU。

  mineru-parser:
    restart: unless-stopped   # 2026-10-06：Docker 啟動時自動啟動（手動 stop 的不會自動起來）
    # MinerU 沒有可直接 pull 的公開 image，沿用本地建置（見 Dockerfile.mineru）。
    # 不保留 GPU：GPU 僅 6GB 且已由 Ollama 使用，MinerU 走 CPU pipeline。
    build:
      context: .
      dockerfile: Dockerfile.mineru
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # 2026-11-18 AHS-UP2 P1-0c：限制 torch／OpenMP 執行緒數，避免一次吃滿所有核心。
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    # 2026-11-18 AHS-UP2 P1-0c：MinerU 原本完全沒有資源上限（cpus=0、mem=0）。同日用 44 MB／24 頁的掃描 PDF
    # 上傳時 CPU 幾乎滿載、數分鐘內整台電腦當機（Kernel-Power 41，非正常關機）。保守限制：一半核心、8 GB 記憶體；
    # 超過記憶體時只會讓容器被殺掉（解析失敗、引擎退回文字層），不會拖垮主機。
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    volumes:
      - ${COUNCIL_DATA_DIR:-./data}/mineru_inputs:/data/inputs
      - ${COUNCIL_DATA_DIR:-./data}/mineru_outputs:/data/outputs
      - ./tools/mineru_watch.sh:/usr/local/bin/mineru_watch.sh:ro
      - ${COUNCIL_DATA_DIR:-./data}/mineru_model_cache:/root/.cache
