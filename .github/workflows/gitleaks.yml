name: gitleaks

# PLAT-M1-02 (B): secret scan over the full git history. The job name "gitleaks" is the
# status-check name intended to be a required check on main (branch protection is changed separately).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --verbose \n            --gitleaks-ignore-path=/repo/.github/gitleaksignore
