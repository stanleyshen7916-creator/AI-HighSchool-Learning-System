name: Supabase Deploy

# AI-126A Deployment Preparation.
#
# workflow_dispatch ONLY — this workflow never runs automatically on push,
# pull_request, or any other event. It only runs when a human explicitly
# clicks "Run workflow" in the GitHub Actions tab. Adding the three secrets
# below does NOT trigger a run by itself.
#
# Required GitHub repository secrets (Settings → Secrets and variables →
# Actions), documented with sourcing steps in supabase/DEPLOYMENT_SETUP.md:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_DB_PASSWORD
#   - SUPABASE_PROJECT_ID
#
# None of these values are ever written into this file or into the
# repository — they are referenced only via ${{ secrets.* }}, which GitHub
# injects at run time and masks in the log output.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Link project and push migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # AI-126A-3: post-deploy verification. All of these run through the
      # Supabase CLI's own Management API (`--linked`), never a hand-built
      # psql/pooler connection string — avoids guessing this project's real
      # pooler region/IPv4-vs-IPv6 host, which is a documented source of
      # CI connection failures for direct Postgres connections. Output is
      # schema/row-count/boolean data only, never a secret value.
      - name: Verify migration history
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply seed data (subjects)
        run: supabase db query --linked --file supabase/seed/0001_subjects.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify tables
        run: |
          supabase db query --linked "select count(*) as table_count from pg_tables where schemaname = 'public';"
          supabase db query --linked "select tablename from pg_tables where schemaname = 'public' order by tablename;"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify RLS enabled + policies
        run: |
          supabase db query --linked "select tablename, rowsecurity from pg_tables where schemaname = 'public' order by tablename;"
          supabase db query --linked "select count(*) as policy_count from pg_policies where schemaname = 'public';"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify seed data
        run: supabase db query --linked "select code, name from public.subjects order by code;"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
